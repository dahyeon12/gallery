<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{height:100%;margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>모든 사진</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 피그마 '모든 사진' 화면 그대로 — 헤더, 월별 3열 그리드, 떠 있는 하단 탭 */
:root{
  --bg:#ffffff; --fg:#14171f; --muted:#6b7180; --line:#e6e8ee;
  --glass:rgba(244,245,248,.86); --glass-line:rgba(20,23,31,.08);
  --pill:rgba(20,23,31,.07); --accent:#2f6bff; --danger:#e5484d;
  --overlay:#0b0c10; --menu:#ececee; --menu-line:#c9cacf;
  --font:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --fg:#eef0f4; --muted:#9aa0ad; --line:#252a33;
  --glass:rgba(32,36,44,.86); --glass-line:rgba(255,255,255,.08);
  --pill:rgba(255,255,255,.1); --accent:#6c97ff; --danger:#ff6b6f; --menu:#2a2d34; --menu-line:#3d414a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1115; --fg:#eef0f4; --muted:#9aa0ad; --line:#252a33;
  --glass:rgba(32,36,44,.86); --glass-line:rgba(255,255,255,.08);
  --pill:rgba(255,255,255,.1); --accent:#6c97ff; --danger:#ff6b6f; --menu:#2a2d34; --menu-line:#3d414a; color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);-webkit-font-smoothing:antialiased}
.app{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 120px;min-height:100%}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:20px 6px}
h1{font-size:26px;font-weight:700;margin:0;letter-spacing:-.02em}
.icons{display:flex;gap:2px}
.icon-btn{width:42px;height:42px;border:0;background:none;color:var(--fg);border-radius:50%;display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{background:var(--pill)}
.icon-btn:focus-visible,.tab:focus-visible,.cell:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon-btn.on{background:var(--accent);color:#fff}
.icon-btn svg{width:24px;height:24px}
.note{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);padding:10px 12px;margin-block:8px 4px;background:var(--pill);border-radius:12px}
.note button{border:0;background:none;color:var(--accent);font:inherit;font-weight:500;cursor:pointer;white-space:nowrap}
.titlewrap{display:flex;align-items:center;gap:2px;min-width:0}
.titlewrap h1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#backBtn{margin-left:-10px}
.albums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px;margin-top:22px}
.album{border:0;padding:0;background:none;color:var(--fg);font:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-width:0}
.album .cover{aspect-ratio:1/1;max-width:100%;border-radius:22px;overflow:hidden;background:var(--line)}
.album .cover img{width:100%;height:100%;object-fit:cover;display:block}
.album .cover.empty-cover{display:grid;place-items:center;color:var(--muted);font-size:13px}
.album .name{font-size:19px;font-weight:700;padding-left:10px;letter-spacing:-.01em}
.album .name small{font-size:15px;font-weight:400;color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}
.album:hover .cover img{opacity:.9}
.album:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:22px}
.selacts{display:flex;align-items:center;gap:4px}
.selbar .txt{border:0;background:none;color:var(--fg);font:inherit;font-size:14px;padding:8px 8px;border-radius:999px;cursor:pointer}
.selbar .txt.danger{color:var(--danger)}
.selbar .txt:disabled{opacity:.35;cursor:default}
.selbar .del.go{background:var(--accent)}
.working{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--muted);margin:-2px 0 12px}
.spin{width:12px;height:12px;border-radius:50%;border:1.6px solid var(--muted);border-top-color:transparent}
@media (prefers-reduced-motion:no-preference){.spin{animation:spin .8s linear infinite}}
@keyframes spin{to{transform:rotate(360deg)}}
.cell.pending img{opacity:.38}
.cell.current{outline:2px solid var(--accent);outline-offset:-2px}
.cell .tag{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:500;color:#fff;background:rgba(0,0,0,.5);padding:2px 8px;border-radius:999px}
.grp{margin-bottom:6px}
.ghead{display:flex;align-items:center;gap:10px;margin:14px 0 8px;min-height:36px}
.gdate{font-size:19px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--pill);border-radius:999px;min-width:0}
.chip button{border:0;background:none;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px;padding:5px 4px 5px 10px;white-space:nowrap}
.chip button.caret{padding:5px 9px 5px 2px}
.chip button svg{width:16px;height:16px;flex:none}
.chip.done button{color:var(--accent)}
.expand{margin-left:auto;width:34px;height:34px;flex:none;border-radius:50%;border:0;background:var(--pill);color:var(--muted);display:grid;place-items:center;cursor:pointer}
.expand svg{width:18px;height:18px}
@media (prefers-reduced-motion:no-preference){.expand svg{transition:transform .2s}}
.expand.open svg{transform:rotate(90deg)}
.cell .more{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px;font-weight:500;color:#fff;background:rgba(40,40,40,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:4px 22px;border-radius:999px;font-variant-numeric:tabular-nums;pointer-events:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);font-size:14px;padding:10px 18px;border-radius:999px;z-index:50;max-width:calc(100% - 32px);opacity:0;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:no-preference){.toast{transition:opacity .2s}}
.menu{position:absolute;z-index:45;background:var(--menu);border-radius:22px;box-shadow:0 14px 40px rgba(0,0,0,.2);padding:10px 0 6px;width:240px;max-width:calc(100vw - 32px)}
.menu .mh{display:flex;align-items:center;gap:6px;color:var(--fg);padding:4px 16px 2px;font-size:12px}
.menu .mh svg{width:22px;height:22px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--fg);font:inherit;font-size:17px;padding:7px 16px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu button:hover,.menu button:focus-visible{background:rgba(127,127,127,.14);outline:0}
.menu hr{border:0;border-top:1px solid var(--menu-line);margin:8px 12px}
.menu .red{color:var(--danger)}
.menu .mempty{font-size:15px;color:var(--muted);padding:7px 16px}
.menu .newrow{display:flex;gap:6px;padding:4px 12px 6px}
.menu .newrow input{flex:1;min-width:0;font:inherit;font-size:15px;padding:7px 10px;border-radius:10px;border:1px solid var(--menu-line);background:var(--bg);color:var(--fg)}
.menu .newrow button{width:auto;font-size:15px;padding:7px 12px;border-radius:10px;background:var(--accent);color:#fff}
.toast button{border:0;background:none;color:var(--accent);font:inherit;font-weight:700;margin-left:10px;cursor:pointer;padding:0}
.toast.show{pointer-events:auto}
.soon{text-align:center;color:var(--muted);padding:80px 0}
.month{font-size:20px;font-weight:700;margin:22px 0 10px;letter-spacing:-.01em}
.month small{font-size:13px;font-weight:400;color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;margin-inline:-6px}
.cell{position:relative;aspect-ratio:1/1;max-width:100%;border:0;padding:0;background:var(--line);cursor:pointer;overflow:hidden}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell .chk{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.2);display:none}
.selecting .cell .chk{display:block}
.cell.sel .chk{background:var(--accent);border-color:var(--accent)}
.cell.sel .chk::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.cell.sel img{opacity:.75}
.drop{display:none;position:fixed;inset:0;z-index:30;background:rgba(47,107,255,.14);border:3px dashed var(--accent);place-items:center;font-size:18px;font-weight:700;color:var(--accent)}
.drop.show{display:grid}
.empty{text-align:center;color:var(--muted);padding:60px 0;line-height:1.7}
.empty button{margin-top:12px}
.primary{border:0;background:var(--accent);color:#fff;font:inherit;font-weight:500;padding:10px 18px;border-radius:999px;cursor:pointer}
/* 하단 탭 */
nav.tabs{position:fixed;left:0;right:0;margin-inline:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(428px,calc(100% - 32px));box-sizing:border-box;display:grid;grid-template-columns:repeat(4,1fr);padding:8px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 8px 30px rgba(0,0,0,.12);z-index:10}
.tab{justify-content:center;text-align:center;border:0;background:none;color:var(--fg);font:inherit;font-size:13px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:999px;cursor:pointer}
.tab svg{width:26px;height:26px}
.tab.active{background:var(--pill)}
/* 선택 바 */
.selbar{position:fixed;left:0;right:0;margin-inline:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(428px,calc(100% - 32px));box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;padding:12px 16px 12px 22px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:11;font-weight:500;font-variant-numeric:tabular-nums}
.selbar .del{border:0;background:var(--danger);color:#fff;font:inherit;padding:8px 16px;border-radius:999px;cursor:pointer}
.selbar .del:disabled{opacity:.4;cursor:default}
/* 전체보기 */
.viewer{position:fixed;inset:0;z-index:40;background:var(--overlay);display:flex;flex-direction:column}
.vtop{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));font-variant-numeric:tabular-nums;font-size:14px}
.vtop .icon-btn,.vnav .icon-btn{color:#fff}
.vtop .icon-btn:hover,.vnav .icon-btn:hover{background:rgba(255,255,255,.12)}
.vimg{flex:1;min-height:0;display:grid;place-items:center;padding:0 8px}
.vimg img{max-width:100%;max-height:100%;object-fit:contain}
.vnav{display:flex;justify-content:center;gap:40px;padding:12px 0 calc(16px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:no-preference){.cell img{transition:opacity .15s}}
</style>

<div class="app" id="app">
  <header>
    <div class="titlewrap"><button class="icon-btn" id="backBtn" aria-label="앨범으로 돌아가기" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 5-7 7 7 7"/></svg></button><h1 id="title">모든 사진</h1></div>
    <div class="icons" id="photoIcons">
      <button class="icon-btn" id="addBtn" aria-label="사진 추가" title="사진 추가"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="icon-btn" aria-label="검색" title="검색 (준비 중)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg></button>
      <button class="icon-btn" id="selBtn" aria-label="선택" title="선택"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.2 2.7 2.7L16.2 9.4"/></svg></button>

    </div>
  </header>
  <input type="file" id="file" accept="image/*" multiple hidden>
  <div class="note" id="note"><span>예시 사진이에요. 체크 아이콘으로 사진을 고르고 ‘분류하기’를 눌러보세요.</span><button id="clearSamples">예시 지우기</button></div>
  <main id="list"></main>
</div>

<nav class="tabs" id="tabs" aria-label="메뉴">
  <button class="tab active" data-tab="photos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="9.5" cy="9.5" r="1.6"/><path d="m4.5 18 5-5 3.5 3.5 2.5-2.5 4 4"/></svg>사진</button>
  <button class="tab" data-tab="albums"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="8.5" y="8.5" width="12" height="12" rx="2"/><path d="M6 17.5V8a2 2 0 0 1 2-2h9.5"/><path d="M3.5 14.5V5.5a2 2 0 0 1 2-2H14"/></svg>앨범</button>
  <button class="tab" data-tab="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="m3.5 6 5.5-2 6 2 5.5-2v14l-5.5 2-6-2-5.5 2z"/><path d="M9 4v14M15 6v14"/></svg>지도</button>
  <button class="tab" data-tab="my"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c1.4-3.6 4.2-5.5 7.5-5.5s6.1 1.9 7.5 5.5"/></svg>마이</button>
</nav>

<div class="selbar" id="selbar" hidden><span id="selCount">0장 선택</span><div class="selacts"><button class="txt" id="allBtn">전체 선택</button><button class="txt danger" id="delBtn" disabled>삭제</button><button class="del go" id="classifyBtn" disabled>분류하기</button></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="menu" id="menu" hidden role="menu"></div>
<div class="drop" id="drop">여기에 사진을 놓으세요</div>

<div class="viewer" id="viewer" hidden role="dialog" aria-label="사진 전체보기">
  <div class="vtop"><button class="icon-btn" id="vClose" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button><span id="vInfo"></span><span style="width:42px"></span></div>
  <div class="vimg"><img id="vImg" alt=""></div>
  <div class="vnav"><button class="icon-btn" id="vPrev" aria-label="이전 사진"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 5-7 7 7 7"/></svg></button><button class="icon-btn" id="vNext" aria-label="다음 사진"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 5 7 7-7 7"/></svg></button></div>
</div>

// 예시 사진의 실제 종류와 찍은 날짜 (AI 연결 전 시연용)
const SAMPLE_INFO = [

 ...[3,4,5,6,7,8].map(()=>['고양이',[2026,9,5]]),
 ...[9,10,11,12].map(()=>['음식',[2026,9,9]]),

];
let photos = SAMPLES.map((src,i)=>{const [cat,d]=SAMPLE_INFO[i]; return {id:'s'+i, src, date:new Date(d[0],d[1],d[2],9,i), sample:true, cat:USE_AI?null:cat, classified:false, album:null}});
let view='photos', openAlbum=null;
let selecting=false, selected=new Set(), order=[], vIndex=0;
let classifying=null; // {queue:[], done:Set, current:id}
const expanded=new Set(), targetOverride=new Map();
const $=id=>document.getElementById(id);
const ICON_ADD='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><path d="M12 10.5v6M9 13.5h6"/></svg>';
const ICON_DONE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';

const monthKey=d=>d.getFullYear()+'년 '+(d.getMonth()+1)+'월';
const dayLabel=d=>d.getFullYear()+'.'+(d.getMonth()+1)+'.'+d.getDate();
const sortAsc=arr=>[...arr].sort((a,b)=>a.date-b.date);
function toast(msg,undo){const t=$('toast'); t.textContent=msg; if(undo){const b=document.createElement('button'); b.textContent='되돌리기'; b.onclick=()=>{undo(); t.classList.remove('show')}; t.append(b)} t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),undo?4500:2200)}
function el(tag,cls,html){const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e}

function render(){
  closeMenu();
  const list=$('list'); list.innerHTML='';
  document.querySelectorAll('.tab').forEach(b=>{const on=b.dataset.tab===(view==='album'?'albums':view); b.classList.toggle('active',on); on?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')});
  $('backBtn').hidden=view!=='album';
  $('photoIcons').hidden=!(view==='photos'||view==='album');
  $('selBtn').hidden=view!=='photos';
  $('note').hidden=!(view==='photos' && photos.some(p=>p.sample && !p.classified) && !classifying);
  if(view==='photos'){ $('title').textContent='모든 사진'; renderPhotos(list); }
  else if(view==='album'){ $('title').textContent=openAlbum; renderPlain(list, sortAsc(photos.filter(p=>p.album===openAlbum))); }
  else if(view==='albums'){ $('title').textContent='앨범'; renderAlbums(list); }
  else { $('title').textContent=view==='map'?'지도':'마이'; list.innerHTML='<div class="soon">준비 중인 화면이에요.</div>'; order=[]; }
}

function makeCell(p, opts={}){
  const b=el('button','cell'+(selected.has(p.id)?' sel':'')); b.dataset.id=p.id; b.setAttribute('aria-label',dayLabel(p.date)+' 사진');
  const img=el('img'); img.alt=''; img.loading='lazy'; img.src=p.src; b.append(img, el('span','chk'));
  if(classifying){
    if(classifying.queue.includes(p.id) && !classifying.done.has(p.id)) b.classList.add('pending');
    if(classifying.done.has(p.id)) b.append(el('span','tag',p.cat));
  }
  if(opts.more){ b.append(el('span','more',opts.more+'+')); }
  b.onclick=()=>{
    if(selecting) return toggle(p.id,b);
    if(opts.onMore) return opts.onMore();
    openViewer(order.indexOf(p));
  };
  return b;
}

function renderPlain(list, sorted){
  order=sorted;
  if(!sorted.length){
    list.innerHTML= view==='album' ? '<div class="empty">이 앨범에 사진이 없어요.</div>'
      : '<div class="empty">아직 사진이 없어요.<br>사진을 여러 장 골라 올려보세요.<br><button class="primary" id="emptyAdd">사진 추가</button></div>';
    const a=$('emptyAdd'); if(a) a.onclick=()=>$('file').click(); return;
  }
  let curMonth=null, grid=null;
  sorted.forEach(p=>{
    const m=monthKey(p.date);
    if(m!==curMonth){ curMonth=m; const arr=sorted.filter(x=>monthKey(x.date)===m); const h=el('h2','month',m); h.append(el('small',null,arr.length+'장')); list.append(h); grid=el('div','grid'); list.append(grid); }
    grid.append(makeCell(p));
  });
}

function renderPhotos(list){
  const sorted=sortAsc(photos); order=sorted;
  if(!sorted.length) return renderPlain(list, sorted);
  // 같은 달 안에서: 분류된 사진은 같은 종류가 이어지는 묶음으로, 나머지는 그냥 그리드로
  let curMonth=null, grid=null, i=0;
  while(i<sorted.length){
    const p=sorted[i], m=monthKey(p.date);
    if(m!==curMonth){
      curMonth=m; grid=null; list.append(el('h2','month',m));
      if(classifying && sorted.some(x=>monthKey(x.date)===m && classifying.queue.includes(x.id))){
        const w=el('div','working'); w.append(el('span','spin'), document.createTextNode('사진을 분류중입니다.')); list.append(w);
      }
    }
    if(!classifying && p.classified && p.cat){
      const run=[p]; let j=i+1;
      while(j<sorted.length && sorted[j].classified && sorted[j].cat===p.cat && monthKey(sorted[j].date)===m){ run.push(sorted[j]); j++; }
      list.append(renderGroup(run)); grid=null; i=j; continue;
    }
    if(!grid){ grid=el('div','grid'); list.append(grid); }
    grid.append(makeCell(p)); i++;
  }
}

function renderGroup(run){
  const key=run[0].id, isOpen=expanded.has(key), n=run.length;
  const target=targetOverride.get(key)||run[0].cat;
  const allIn=run.every(p=>p.album===target);
  const sec=el('section','grp');
  const head=el('div','ghead');
  head.append(el('span','gdate',dayLabel(run[0].date)));
  const chip=el('div','chip'+(allIn?' done':''));
  const add=el('button',null, (allIn?ICON_DONE:ICON_ADD)+'<span></span>');
  add.querySelector('span').textContent= allIn ? '‘'+target+'’에 추가됨' : '‘'+target+'’에 추가';
  add.onclick=()=>{ if(!allIn) addGroupTo(key,target); };
  const caret=el('button','caret',ICON_CARET); caret.setAttribute('aria-label','다른 앨범 고르기'); caret.setAttribute('aria-haspopup','menu');
  caret.onclick=e=>{e.stopPropagation(); openMenu(caret, key, target)};
  chip.append(add, caret); head.append(chip);
  if(n>3){
    const ex=el('button','expand'+(isOpen?' open':''),ICON_RIGHT); ex.setAttribute('aria-label',isOpen?'접기':'펼치기'); ex.setAttribute('aria-expanded',isOpen);
    ex.onclick=()=>{isOpen?expanded.delete(key):expanded.add(key); render()};
    head.append(ex);
  }
  sec.append(head);
  const grid=el('div','grid');
  const shown=isOpen?run:run.slice(0,3);
  shown.forEach((p,idx)=>{
    const opts={};
    if(!isOpen && n>3 && idx===2){ opts.more=n-3; opts.onMore=()=>{expanded.add(key); render()}; }
    grid.append(makeCell(p,opts));
  });
  sec.append(grid);
  return sec;
}

const ICON_CLOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2.5"/></svg>';
let recentAlbums=[]; // 최근에 추가한 앨범 순서
function groupOf(key){ const sorted=sortAsc(photos); const i=sorted.findIndex(p=>p.id===key); if(i<0) return []; const p=sorted[i]; const run=[p]; for(let j=i+1;j<sorted.length && sorted[j].classified && sorted[j].cat===p.cat && monthKey(sorted[j].date)===monthKey(p.date);j++) run.push(sorted[j]); return run; }
function addGroupTo(key, name){
  const run=groupOf(key); run.forEach(p=>p.album=name); targetOverride.set(key,name);
  recentAlbums=[name,...recentAlbums.filter(n=>n!==name)];
  toast('‘'+name+'’ 앨범에 '+run.length+'장을 추가했어요'); render();
}
function openMenu(anchor, key, current){
  const menu=$('menu'); menu.innerHTML='';
  const head=el('div','mh',ICON_CLOCK); head.setAttribute('aria-label','최근 앨범'); head.title='최근 앨범'; menu.append(head);
  // 최근에 사진을 추가한 앨범만, 가장 최근 순서로 3개까지
  const names=recentAlbums.filter(n=>photos.some(p=>p.album===n)).slice(0,3);
  if(!names.length) menu.append(el('div','mempty','최근에 추가한 앨범이 없어요'));
  names.forEach(n=>{const b=el('button'); b.setAttribute('role','menuitem'); b.textContent='‘'+n+'’에 추가'; b.onclick=e=>{e.stopPropagation(); addGroupTo(key,n)}; menu.append(b)});
  menu.append(el('hr'));
  const all=el('button',null,'앨범에 추가'); all.setAttribute('role','menuitem'); all.onclick=e=>{e.stopPropagation(); albumPicker(key)}; menu.append(all);
  menu.append(el('hr'));
  const un=el('button',null,'그룹 해제'); un.setAttribute('role','menuitem');
  un.onclick=e=>{e.stopPropagation(); const run=groupOf(key); run.forEach(p=>p.classified=false); expanded.delete(key); targetOverride.delete(key); toast(run.length+'장의 그룹을 해제했어요'); render()};
  menu.append(un, el('hr'));
  const del=el('button','red','삭제'); del.setAttribute('role','menuitem');
  del.onclick=e=>{e.stopPropagation(); const run=groupOf(key); const ids=new Set(run.map(p=>p.id)); const removed=photos.filter(p=>ids.has(p.id)); photos=photos.filter(p=>!ids.has(p.id)); render(); toast(removed.length+'장을 삭제했어요', ()=>{photos=photos.concat(removed); render()})};
  menu.append(del);
  placeMenu(anchor);
}
function albumPicker(key){
  const menu=$('menu'); menu.innerHTML='';
  menu.append(el('div','mh','앨범 고르기'));
  const names=[...new Set([...recentAlbums,...photos.map(p=>p.album).filter(Boolean),...photos.filter(p=>p.classified).map(p=>p.cat)])];
  names.forEach(n=>{const b=el('button'); b.textContent=n; b.onclick=e=>{e.stopPropagation(); addGroupTo(key,n)}; menu.append(b)});
  menu.append(el('hr'));
  const row=el('form','newrow'); const inp=el('input'); inp.id='newAlbum'; inp.placeholder='새 앨범 이름'; inp.maxLength=20; const ok=el('button',null,'만들기'); ok.type='submit';
  row.append(inp,ok); row.onsubmit=e=>{e.preventDefault(); const v=inp.value.trim(); if(v) addGroupTo(key,v); else inp.focus()};
  row.onclick=e=>e.stopPropagation();
  menu.append(row);
}
function placeMenu(anchor){
  const menu=$('menu'); menu.hidden=false;
  const r=anchor.getBoundingClientRect(), w=menu.offsetWidth, vw=document.documentElement.clientWidth;
  menu.style.left=(Math.max(16,Math.min(r.left-20, vw-w-16))+scrollX)+'px';
  menu.style.top=(r.bottom+scrollY+8)+'px';
  menu.querySelector('button')?.focus({preventScroll:true});
}
function closeMenu(){ $('menu').hidden=true }
document.addEventListener('click',e=>{ if(!$('menu').hidden && !$('menu').contains(e.target)) closeMenu() });

function renderAlbums(list){
  order=[];
  const m=new Map();
  photos.forEach(p=>{ if(!p.album) return; if(!m.has(p.album)) m.set(p.album,[]); m.get(p.album).push(p) });
  if(!m.size){ list.innerHTML='<div class="empty">아직 앨범이 없어요.<br>사진 탭에서 분류한 뒤 ‘앨범에 추가’를 누르면<br>여기에 앨범이 만들어져요.</div>'; return; }
  const wrap=el('div','albums');
  for(const [name,arr] of m){
    const cover=sortAsc(arr)[0];
    const b=el('button','album'); b.setAttribute('aria-label',name+' 앨범, '+arr.length+'장');
    const c=el('div','cover'); const img=el('img'); img.alt=''; img.src=cover.src; c.append(img);
    const nm=el('div','name'); nm.append(name, el('small',null,'('+arr.length+')'));
    b.append(c,nm); b.onclick=()=>{openAlbum=name; go('album')};
    wrap.append(b);
  }
  list.append(wrap);
}

function go(v){ if(selecting) setSelecting(false,true); view=v; render(); window.scrollTo(0,0); }
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>go(b.dataset.tab));
$('backBtn').onclick=()=>go('albums');

function addFiles(files){
  const imgs=[...files].filter(f=>f.type.startsWith('image/'));
  if(!imgs.length) return;
  imgs.forEach((f,i)=>photos.push({id:'u'+Date.now()+'_'+i, src:URL.createObjectURL(f), date:new Date(f.lastModified||Date.now()), name:f.name, cat:null, classified:false, album:null}));
  view='photos'; render(); toast(imgs.length+'장을 추가했어요');
}
$('addBtn').onclick=()=>$('file').click();
$('file').onchange=e=>{addFiles(e.target.files); e.target.value=''};
$('clearSamples').onclick=()=>{photos=photos.filter(p=>!p.sample); render()};

// 선택 모드
function setSelecting(on,silent){
  if(on && classifying) return toast('분류가 끝나면 다시 선택할 수 있어요');
  selecting=on; selected.clear();
  $('app').classList.toggle('selecting',on); $('selBtn').classList.toggle('on',on);
  $('selbar').hidden=!on; $('tabs').hidden=on; updateSel(); if(!silent) render();
}
function toggle(id,elm){selected.has(id)?selected.delete(id):selected.add(id); elm.classList.toggle('sel'); updateSel()}
function updateSel(){
  $('selCount').textContent=selected.size+'장 선택';
  $('delBtn').disabled=!selected.size; $('classifyBtn').disabled=!selected.size;
  $('allBtn').textContent= selected.size && selected.size===photos.length ? '선택 해제' : '전체 선택';
}
$('selBtn').onclick=()=>setSelecting(!selecting);
$('allBtn').onclick=()=>{
  if(selected.size===photos.length) selected.clear(); else photos.forEach(p=>selected.add(p.id));
  document.querySelectorAll('.cell').forEach(c=>c.classList.toggle('sel',selected.has(c.dataset.id))); updateSel();
};
$('delBtn').onclick=()=>{const n=selected.size; photos=photos.filter(p=>!selected.has(p.id)); setSelecting(false); toast(n+'장을 삭제했어요')};

// 분류하기: 위에서부터 한 장씩
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const cellOf=id=>document.querySelector('.cell[data-id="'+id+'"]');
// 사진을 긴 변 512px JPEG로 줄여 base64로 (속도·비용 절약)
function toJpegBase64(src,max){return new Promise((res,rej)=>{const img=new Image(); img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(img.width*s)); c.height=Math.max(1,Math.round(img.height*s)); c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',0.82).split(',')[1])}; img.onerror=()=>rej(new Error('사진을 읽지 못했어요')); img.src=src})}
async function aiClassify(p, existing){
  const image=await toJpegBase64(p.src,512);
  const r=await fetch('/api/classify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({image,existing})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok || !j.category) throw new Error(j.error||('서버 응답 오류 '+r.status));
  return j.category;
}
$('classifyBtn').onclick=async()=>{
  const chosen=sortAsc(photos.filter(p=>selected.has(p.id)));
  const todo=chosen.filter(p=>!p.classified && (USE_AI || p.cat));
  const noAI=USE_AI?0:chosen.filter(p=>!p.cat).length;
  setSelecting(false,true);
  if(!todo.length){ render(); return toast(noAI ? '직접 올린 사진은 AI를 연결하면 분류할 수 있어요' : '이미 분류된 사진이에요'); }
  classifying={queue:todo.map(p=>p.id), done:new Set()};
  render(); window.scrollTo({top:0,behavior:'smooth'});
  let failed=0, lastErr='';
  await wait(400);
  for(const p of todo){
    const c=cellOf(p.id); if(c){c.classList.add('current'); c.classList.remove('pending');}
    try{
      if(USE_AI){
        // 이미 생긴 카테고리·앨범 이름을 같이 보내 같은 종류는 같은 이름으로 묶이게
        const existing=[...new Set(photos.filter(x=>x.cat && (x.classified||classifying.done.has(x.id))).map(x=>x.cat).concat(photos.map(x=>x.album).filter(Boolean)))];
        p.cat=await aiClassify(p, existing);
      } else await wait(330);
      classifying.done.add(p.id);
      if(c) c.append(el('span','tag',p.cat));
    }catch(err){ failed++; lastErr=err.message; }
    if(c) c.classList.remove('current');
  }
  todo.forEach(p=>{ if(classifying.done.has(p.id)) p.classified=true; });
  classifying=null; await wait(450); render();
  if(failed) toast(failed+'장은 분류하지 못했어요 ('+lastErr+')');
  else toast(noAI ? '분류 완료. 직접 올린 '+noAI+'장은 AI 연결 후 분류돼요' : '분류를 마쳤어요. 앨범에 추가해 보세요');
};

// 전체보기
function openViewer(i){ if(i<0) return; vIndex=i; showV(); $('viewer').hidden=false}
function showV(){const p=order[vIndex]; $('vImg').src=p.src; $('vInfo').textContent=(vIndex+1)+' / '+order.length}
$('vClose').onclick=()=>$('viewer').hidden=true;
$('vPrev').onclick=()=>{vIndex=(vIndex-1+order.length)%order.length; showV()};
$('vNext').onclick=()=>{vIndex=(vIndex+1)%order.length; showV()};
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeMenu(); if($('viewer').hidden) return; if(e.key==='Escape')$('vClose').click(); if(e.key==='ArrowLeft')$('vPrev').click(); if(e.key==='ArrowRight')$('vNext').click()});

// 끌어다 놓기
let dragDepth=0;
addEventListener('dragenter',e=>{if([...e.dataTransfer.types].includes('Files')){dragDepth++;$('drop').classList.add('show')}});
addEventListener('dragleave',()=>{dragDepth=Math.max(0,dragDepth-1); if(!dragDepth)$('drop').classList.remove('show')});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault(); dragDepth=0; $('drop').classList.remove('show'); addFiles(e.dataTransfer.files)});
render();
</script>

</html>
